name: Build and Push Docker Images

on:
  push:
    branches: [main, 'GEN*', 'gen*']
    paths:
      - 'scripts/**'
      - '.github/workflows/build-docker-images.yml'

  workflow_dispatch:

jobs:
  build_references_docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ["data_guide", "patch_release", "release_utils", "sync_tables", "table_schemas"] # Define the modules you want to loop through for builds
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: sage-bionetworks-workflows/nf-genie
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v3

    - name: Fetch the default branch (main) for comparison
      run: git fetch origin main:refs/remotes/origin/main --depth=1

    - name: Check for Changes in scripts/${{ matrix.module }}
      id: check_changes
      run: |
        set -euo pipefail

        if [ "${{ github.ref_name }}" = "main" ]; then
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            DIFF_BASE="HEAD^"
          else
            echo "HEAD^ not available; treating scripts/${{ matrix.module }} as changed"
            echo "CHANGED=true" >> "$GITHUB_ENV"
            exit 0
          fi
        else
          if git rev-parse --verify origin/main >/dev/null 2>&1 && git merge-base --is-ancestor origin/main HEAD; then
            DIFF_BASE="origin/main"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            DIFF_BASE="HEAD^"
          else
            echo "No usable diff base; treating scripts/${{ matrix.module }} as changed"
            echo "CHANGED=true" >> "$GITHUB_ENV"
            exit 0
          fi
        fi

        echo "Using DIFF_BASE=$DIFF_BASE"

        if git diff --name-only "$DIFF_BASE" HEAD -- "scripts/${{ matrix.module }}" | grep -q .; then
          echo "CHANGED=true" >> "$GITHUB_ENV"
        else
          echo "CHANGED=false" >> "$GITHUB_ENV"
        fi
    - name: Log in to GitHub Container Registry
      if: env.CHANGED == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image for scripts/${{ matrix.module }}
      if: env.CHANGED == 'true'
      uses: docker/build-push-action@v5
      with:
        context: scripts/${{ matrix.module }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.module }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.module }}
        cache-to: type=inline
